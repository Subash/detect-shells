name: Tests
on: [push]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm install
        run: npm ci
      - name: npm run typecheck
        run: npm run typecheck
      - name: npm run test
        run: npm run test
